function renderNotes(){const notes=state.items.filter(i=>i.type==='note');return `<div class="page-head"><div><h1>便签</h1></div>${btn('新建便签','new-note','plus','btn primary')}</div><div class="sub-toolbar"><span class="small muted">${notes.length} 张便签 · 内容保存在本机</span>${btn('整理成待办','notes-to-ai','sparkles','btn subtle')}</div><div class="note-grid">${notes.map(i=>`<article class="note-card note-${i.color}"><div class="spread"><span class="eyebrow">${h(cat(i.category).name)}</span><div class="row" style="gap:2px">${ib('生成便签组件','pin-item','pin',`data-id="${i.id}"`,'small-btn')}${ib('编辑便签','edit','external',`data-id="${i.id}"`,'small-btn')}</div></div><button data-action="edit" data-id="${i.id}" style="text-align:left;padding:0"><h3>${h(i.title)}</h3></button><div class="note-content">${h(i.body)}</div>${i.remindAt?`<div class="tiny" style="margin-bottom:10px">${ic('bell')} ${shortDT(i.remindAt)}</div>`:''}<div class="note-bottom"><span>${formatDate(i.createdAt.slice(0,10))}记录</span>${btn('转为待办','note-to-task','arrow','btn sm',`data-id="${i.id}"`)}</div></article>`).join('')}<button class="note-card add-note" data-action="new-note">${ic('plus')}<span class="small">写下一个新想法</span></button></div>`}
function calendarItems(d){return state.items.filter(i=>scheduledOn(i,d)).sort((a,b)=>(a.startTime||'00:00').localeCompare(b.startTime||'00:00'))}
function calChip(i,d){return `<button class="cal-chip ${i.type} ${i.status==='done'?'done':''}" data-action="edit" data-id="${i.id}" title="${h(i.title)}" draggable="${i.type!=='note'}" data-drag-item="${i.id}">${i.startTime&&i.planDate===d?`<span class="time-prefix">${h(i.startTime)} </span>`:''}${i.type==='task'&&!i.planDate?'截止 · ':''}${h(i.title)}</button>`}
function renderCalendar(){const d=dateOf(calendarAnchor),title=calendarMode==='year'?`${d.getFullYear()} 年`:calendarMode==='day'?`${d.getMonth()+1} 月 ${d.getDate()} 日 · ${weekday(calendarAnchor)}`:calendarMode==='week'?`${formatDate(monday(calendarAnchor),true)} — ${formatDate(addDays(monday(calendarAnchor),6),true)}`:`${d.getFullYear()} 年 ${d.getMonth()+1} 月`;const unscheduled=activeTasks().filter(i=>!i.planDate);return `<div class="page-head"><div><h1>日历</h1></div>${btn('新建日程','new-event','plus','btn primary',`data-date="${calendarAnchor}"`)}</div><section class="calendar-shell"><div class="cal-toolbar"><div class="row"><h2>${title}</h2>${ib('上一'+{year:'年',month:'月',week:'周',day:'天'}[calendarMode],'cal-prev','left')}${ib('下一'+{year:'年',month:'月',week:'周',day:'天'}[calendarMode],'cal-next','chevron')}${btn('今天','cal-today','','btn sm')}</div><div class="segment" aria-label="日历视图">${Object.entries({year:'年',month:'月',week:'周',day:'日'}).map(([m,l])=>btn(l,'cal-mode','',calendarMode===m?'active':'',`data-mode="${m}"`)).join('')}</div></div><div class="cal-legend"><span><i class="dot" style="--dot:#86a697"></i>待办 / 执行计划</span><span><i class="dot" style="--dot:#8aa5d2"></i>固定日程</span><span><i class="dot" style="--dot:#d7ac6a"></i>便签提醒</span></div>${calendarMode==='month'?renderMonth(d):calendarMode==='year'?renderYear(d):renderTimeCalendar(calendarMode==='day'?[calendarAnchor]:Array.from({length:7},(_,n)=>addDays(monday(calendarAnchor),n)))}<div class="time-hint">${calendarMode==='year'?'点击月份查看详情。带底色的日期包含事项。':calendarMode==='month'?'点击空白日期新建日程；点击事项编辑。未安排执行时间的待办以截止日展示。':'点击空白时段新建日程，或拖入待办安排执行。重叠事项并列展示；时间轴以外的事项显示在顶部。'}</div></section><section class="card calendar-bottom"><div class="spread"><div><h3 style="font-size:12px">待安排的待办 <span class="muted">${unscheduled.length}</span></h3><p class="tiny muted" style="margin-top:4px">拖到日历里，或者打开详情设置计划时间。截止日期保持不变。</p></div>${btn('快速新建','new','plus','btn ghost sm')}</div><div class="unscheduled-row">${unscheduled.slice(0,12).map(i=>`<button class="unscheduled-task" draggable="true" data-drag-item="${i.id}" data-action="edit" data-id="${i.id}">${ic('grip')}${h(i.title)}</button>`).join('')||'<p class="tiny muted">所有待办都已安排了计划日期。</p>'}</div></section>`}
function renderMonth(d){const first=day(new Date(d.getFullYear(),d.getMonth(),1)),start=monday(first);return `<div class="weeknames">${['一','二','三','四','五','六','日'].map(x=>`<span>周${x}</span>`).join('')}</div><div class="month-grid">${Array.from({length:42},(_,n)=>{const ds=addDays(start,n),items=calendarItems(ds);return `<div class="month-cell ${dateOf(ds).getMonth()!==d.getMonth()?'outside':''}" data-action="cal-cell" data-date="${ds}" data-drop-date="${ds}" tabindex="0" role="button" aria-label="${h(formatDate(ds,true))}，${items.length} 个事项，点击新建"><div class="month-number ${ds===today()?'today':''}">${dateOf(ds).getDate()}</div>${items.slice(0,3).map(i=>calChip(i,ds)).join('')}${items.length>3?`<button class="more-chip" data-action="cal-day" data-date="${ds}">还有 ${items.length-3} 项</button>`:''}</div>`}).join('')}</div>`}
function renderYear(d){return `<div class="year-grid">${Array.from({length:12},(_,m)=>{const first=day(new Date(d.getFullYear(),m,1)),offset=(dateOf(first).getDay()+6)%7,num=new Date(d.getFullYear(),m+1,0).getDate();return `<button class="mini-month" data-action="cal-month" data-date="${first}"><h3>${m+1} 月 <span class="tiny muted">${state.items.filter(i=>calendarDate(i).startsWith(first.slice(0,7))).length} 项</span></h3><div class="mini-days">${['一','二','三','四','五','六','日'].map(w=>`<span>${w}</span>`).join('')}${'<span></span>'.repeat(offset)}${Array.from({length:num},(_,n)=>{const s=`${first.slice(0,8)}${pad(n+1)}`;return `<span class="mini-num ${s===today()?'today':''} ${calendarItems(s).length?'has-items':''}">${n+1}</span>`}).join('')}</div></button>`}).join('')}</div>`}
function blockInterval(i,d){let s=i.type==='event'&&i.planDate<d?480:minutes(i.startTime);let e=i.type==='event'?(i.endDate&&i.endDate>d?1200:minutes(i.endTime||timeFrom(s+60))):s+(Number(i.duration)||30);return {i,s:Math.max(480,s),e:Math.min(1200,Math.max(e,s+15)),col:0,cols:1}}
function layoutIntervals(items,d){const xs=items.map(i=>blockInterval(i,d)).filter(v=>v.e>v.s).sort((a,b)=>a.s-b.s||b.e-a.e);let group=[],end=-1;const finish=()=>{const lanes=[];group.forEach(x=>{let lane=lanes.findIndex(e=>e<=x.s);if(lane<0)lane=lanes.length;x.col=lane;lanes[lane]=x.e;});group.forEach(x=>x.cols=lanes.length);};for(const x of xs){if(x.s>=end&&group.length){finish();group=[];end=-1}group.push(x);end=Math.max(end,x.e)}finish();return xs}
function renderTimeCalendar(days){return `<div class="week-scroll"><div class="time-calendar ${days.length===1?'day-only':''}" style="--cols:${days.length}"><div class="time-header"><div></div>${days.map(d=>`<div class="${d===today()?'is-today':''}">${weekday(d)}<button data-action="cal-day" data-date="${d}"><b>${dateOf(d).getDate()}</b></button></div>`).join('')}</div><div class="all-day-row"><div class="all-day-label">全天<br>及其他</div>${days.map(d=>`<div data-drop-date="${d}">${calendarItems(d).filter(i=>!i.startTime||(i.type==='task'&&!i.planDate)||i.type==='note'||(minutes(i.startTime)<480&&i.planDate===d)||(minutes(i.startTime)>=1200&&i.planDate===d)).map(i=>calChip(i,d)).join('')}</div>`).join('')}</div><div class="time-grid"><div class="hour-labels">${Array.from({length:13},(_,n)=>`<span class="hour-label" style="top:${n*72}px">${pad(n+8)}:00</span>`).join('')}</div>${days.map(d=>{const items=calendarItems(d).filter(i=>i.type!=='note'&&i.startTime&&(i.type==='event'||i.planDate)&&(minutes(i.startTime)<1200)&&(minutes(i.startTime)>=480||i.planDate<d));return `<div class="time-day" data-action="time-slot" data-date="${d}" data-drop-date="${d}" data-drop-time="true">${layoutIntervals(items,d).map(x=>`<button class="time-event ${x.i.type}" style="top:${(x.s-480)*1.2+2}px;height:${Math.max(25,(x.e-x.s)*1.2-4)}px;left:calc(${x.col/x.cols*100}% + 3px);width:calc(${100/x.cols}% - 6px)" data-action="edit" data-id="${x.i.id}" draggable="true" data-drag-item="${x.i.id}" title="${h(x.i.title)}"><strong>${h(x.i.title)}</strong><span>${h(x.i.startTime)}${x.i.endTime?' – '+h(x.i.endTime):' · '+x.i.duration+' 分钟'}</span></button>`).join('')}</div>`}).join('')}</div></div></div>`}
function widgetItems(w){if(w.kind==='item')return state.items.filter(i=>i.id===w.target);if(w.kind==='category')return sorted(state.items.filter(i=>i.category===w.target&&i.status!=='done'));if(w.kind==='week'){const start=monday(today()),end=addDays(start,6);return state.items.filter(i=>i.type==='event'&&i.planDate<=end&&(i.endDate||i.planDate)>=start).sort((a,b)=>(a.planDate+a.startTime).localeCompare(b.planDate+b.startTime))}return sorted(todayItems().filter(i=>i.type==='task'&&i.status!=='done'))}
function widgetName(w){if(w.kind==='item')return item(w.target)?.title||'原事项已删除';if(w.kind==='category')return cat(w.target).name;return w.kind==='week'?'本周日程':'今日待办'}
function widgetHTML(w,popup=false){const items=widgetItems(w),single=w.kind==='item'?items[0]:null,note=single?.type==='note';let body='';if(single?.type==='note')body=`<h3>${h(single.title)}</h3><div class="note-content">${h(single.body)}</div>${single.remindAt?`<p class="tiny" style="margin-top:12px">${ic('bell')} ${shortDT(single.remindAt)}</p>`:''}`;else if(single?.type==='event')body=`<div class="widget-event-time">${single.startTime||'全天'}</div><div class="widget-event-date">${formatDate(single.planDate)} · ${weekday(single.planDate)}${single.endTime?' · 至 '+single.endTime:''}</div><h3>${h(single.title)}</h3><p class="tiny muted">${h(single.body||'时间到了，记得给自己留出准备的空档。')}</p>${btn('查看详情','edit','arrow','btn ghost sm',`data-id="${single.id}" style="padding-left:0;margin-top:10px"`)}`;else body=items.slice(0,w.size==='small'?3:w.size==='large'?7:5).map(i=>`<div class="widget-task"><button class="task-check ${i.status==='done'?'done':''} ${i.type!=='task'?i.type:''}" data-action="${i.type==='task'?'complete':'edit'}" data-id="${i.id}" aria-label="${h((i.type==='task'?(i.status==='done'?'恢复待办：':'完成待办：'):'查看：')+i.title)}">${i.status==='done'?ic('check'):i.type==='event'?ic('calendar'):i.type==='note'?ic('note'):''}</button><div class="grow"><button class="task-title" data-action="edit" data-id="${i.id}" style="${i.status==='done'?'text-decoration:line-through;opacity:.6':''}">${h(i.title)}</button><div class="small muted">${i.startTime?h(i.startTime)+' · ':''}${i.type==='event'?formatDate(i.planDate):i.dueDate?formatDate(i.dueDate)+'截止':h(cat(i.category).name)}</div></div></div>`).join('')||`<p class="widget-empty">${w.kind==='item'?'原内容已删除。可以移除这个组件。':'这里的事项都已处理好了。享受一点空白时间。'}</p>`;return `<article class="widget ${w.size} ${note?'note-'+single.color:''}" data-widget="${w.id}" style="left:${Number(w.x)||20}px;top:${Number(w.y)||70}px"><div class="widget-handle" data-handle="${w.id}"><span class="widget-name">${ic(note?'note':single?.type==='event'||w.kind==='week'?'cale function renderWidgets(){return `<div class="page-head"><div><h1>网页组件</h1></div>${btn('添加组件','new-widget','plus','btn primary')}</div><div class="desktop-canvas" id="desktop-canvas"><div class="canvas-label">${ic('grip')} 网页组件 · 拖动标题栏调整位置</div><div class="desktop-clock"><strong>${pad(new Date().getHours())}:${pad(new Date().getMinutes())}</strong><p>${formatDate(today(),true)} ${weekday(today())}</p></div>${state.widgets.map(w=>widgetHTML(w)).join('')}${!state.widgets.length?'<div style="padding:150px 25px;text-align:center">'+empty('给桌面留一个位置','可以添加今日清单、整个分类，或一张喜欢的便签。','new-widget','添加组件')+'</div>':''}</div>`}

function renderAIResults(){if(!aiAnalyzed)return `<div class="spread"><h3>拆解预览</h3><span class="chip">等待输入</span></div><div class="ai-placeholder"><div class="illustration"><div></div><div></div>${ic('tasks')}</div><h3>尚无候选</h3><p>左侧输入一段需求，再点击拆解。<br>待办、日程与便签会分别出现，<br>确认之前不会新增任何内容。</p></div>`;if(aiCommitted)return `<div class="ai-placeholder"><div class="empty-icon" style="color:var(--sage);margin-bottom:18px">${ic('check')}</div><h3>已添加事项</h3><p>你可以在全部事项、日历和便签中继续修改。<br>每条事项都保留了拆解原文。</p><div class="row" style="justify-content:center;margin-top:22px">${btn('查看全部事项','nav','arrow','btn primary','data-view="all"')}${btn('继续拆解','ai-reset','','btn')}</div></div>`;return `<div class="spread ai-result-head"><div><h3>识别到 ${aiDrafts.length} 件事</h3><p class="tiny muted" style="margin-top:5px">逐项核对后再添加，时间可修改。</p></div><span class="chip orange">待你确认</span></div>${aiDrafts.map((d,n)=>`<article class="ai-draft" data-draft="${n}"><div class="row"><input type="checkbox" data-draft-field="selected" data-index="${n}" aria-label="选择候选事项 ${n+1}" ${d.selected?'checked':''}><input class="draft-title" data-draft-field="title" data-index="${n}" value="${h(d.title)}" aria-label="候选事项 ${n+1} 标题"></div><div class="ai-draft-fields"><select data-draft-field="type" data-index="${n}" aria-label="候选事项 ${n+1} 类型">${Object.entries(TYPE).map(([v,l])=>`<option value="${v}" ${d.type===v?'selected':''}>${l}</option>`).join('')}</select><input type="date" data-draft-field="date" data-index="${n}" aria-label="候选事项 ${n+1} 日期" value="${h(d.date)}"><input type="time" data-draft-field="time" data-index="${n}" aria-label="候选事项 ${n+1} 时间" value="${h(d.time)}"></div><div class="row" style="margin:8px 0 9px 26px"><span class="tiny muted">归入</span><select data-draft-field="category" data-index="${n}" aria-label="候选事项 ${n+1} 分类" style="font-size:12px;padding:4px 7px;border-radius:6px;max-width:160px">${state.categories.map(c=>`<option value="${c.id}" ${d.category===c.id?'selected':''}>${h(c.name)}</option>`).join('')}</select>${d.explicitReminder?'<span class="tiny muted">需提醒时刻</span>':''}</div><div class="ai-source"><strong>${d.date?'已解析日期，仍请核对':'未明确日期 · 保持未安排'}</strong>${d.repeat!=='none'?' · '+REPEAT[d.repeat]:''}<br>来源：${h(d.source.slice(0,100))}</div></article>`).join('')}<div class="info-strip">待办日期用于计划执行；明确写出“截止”时才设置截止日。确认后添加。</div><div class="spread ai-actions">${btn('重新编辑需求','ai-input-focus','','btn ghost sm')}${btn('确认添加选中事项','ai-confirm','check','btn primary')}</div>`}
function openModal(title,body,footer='',opts={}){if(!$('#modal-root').children.length)lastFocus=document.activeElement;$('#app').inert=true;$('#mobile-nav').inert=true;$('#modal-root').innerHTML=`<div class="overlay ${opts.drawer?'drawer-overlay':''}" data-overlay="true"><section class="modal ${opts.drawer?'drawer':''} ${opts.wide?'wide':''}" role="dialog" aria-modal="true" aria-labelledby="dialog-title" tabindex="-1"><header class="modal-header"><h2 id="dialog-title">${h(title)}</h2>${ib('关闭','close-modal','close')}</header><div class="modal-content">${body}</div>${footer?`<footer class="modal-footer">${footer}</footer>`:''}</section></div>`;setTimeout(()=>{const el=$('.modal [autofocus]')||$('.modal input:not([type=hidden])')||$('.modal button')||$('.modal');el?.focus()},25)}
let editorDirty=false, editorExisting=false;

function safeBackup(v){if(!validState(v))return false;const ids=new Set(),catIds=new Set(v.categories.map(c=>c.id));if(catIds.size!==v.categories.length)return false;for(const i of v.items){if(ids.has(i.id)||i.title.length>300||i.body.length>100000||!catIds.has(i.category)||!Object.keys(PRIORITY).includes(i.priority))return false;ids.add(i.id);for(const k of ['dueDate','planDate','startTime','endDate','endTime','remindAt','sourceId','sourceText','createdAt','updatedAt'])if(typeof i[k]!=='string')return false;for(const k of ['dueDate','planDate','endDate'])if(i[k]&&(!/^\d{4}-\d{2}-\d{2}$/.test(i[k])||day(dateOf(i[k]))!==i[k]))return false;for(const k of ['startTime','endTime'])if(i[k]&&!/^([01]\d|2[0-3]):[0-5]\d$/.test(i[k]))return false;if(i.remindAt&&!/^\d{4}-\d{2}-\d{2}T([01]\d|2[0-3]):[0-5]\d$/.test(i.remindAt))return false;if(!Number.isFinite(i.duration)||i.duration<0||!i.subtasks.every(s=>typeof s.text==='string'&&typeof s.done==='boolean'))return false;}const wids=new Set();for(const w of v.widgets){if(!w.id||!/^[\w-]+$/.test(w.id)||wids.has(w.id)||!['item','category','today','week'].includes(w.kind)||!['small','medium','large'].includes(w.size)||typeof w.target!=='string'||!Number.isFinite(w.x)||!Number.isFinite(w.y))return false;wids.add(w.id)}return Array.isArray(v.reminderSeen)&&v.reminderSeen.every(s=>typeof s==='string')}
