function renderCalendar(){if(matchMedia('(max-width:899px)').matches)return renderAgenda();const d=dateOf(calendarAnchor),title=calendarMode==='year'?`${d.getFullYear()} 年`:calendarMode==='day'?`${d.getMonth()+1} 月 ${d.getDate()} 日 · ${weekday(calendarAnchor)}`:calendarMode==='week'?`${formatDate(monday(calendarAnchor),true)} — ${formatDate(addDays(monday(calendarAnchor),6),true)}`:`${d.getFullYear()} 年 ${d.getMonth()+1} 月`;const unscheduled=activeTasks().filter(i=>!i.planDate);return `<div class="page-head"><div><h1>日历</h1></div>${btn('新建日程','new-event','plus','btn primary',`data-date="${calendarAnchor}"`)}</div><section class="calendar-shell"><div class="cal-toolbar"><div class="row"><h2>${title}</h2>${ib('上一'+{year:'年',month:'月',week:'周',day:'天'}[calendarMode],'cal-prev','left')}${ib('下一'+{year:'年',month:'月',week:'周',day:'天'}[calendarMode],'cal-next','chevron')}${btn('今天','cal-today','','btn sm')}</div><div class="segment" aria-label="日历视图">${Object.entries({year:'年',month:'月',week:'周',day:'日'}).map(([m,l])=>btn(l,'cal-mode','',calendarMode===m?'active':'',`data-mode="${m}"`)).join('')}</div></div><div class="cal-legend"><span><i class="dot" style="--dot:var(--status-complete)"></i>待办 / 执行计划</span><span><i class="dot" style="--dot:var(--status-pending)"></i>固定日程</span><span><i class="dot" style="--dot:var(--status-progress)"></i>便签提醒</span></div>${calendarMode==='month'?renderMonth(d):calendarMode==='year'?renderYear(d):renderTimeCalendar(calendarMode==='day'?[calendarAnchor]:Array.from({length:7},(_,n)=>addDays(monday(calendarAnchor),n)))}<div class="time-hint">${calendarMode==='year'?'点击月份查看详情。带底色的日期包含事项。':calendarMode==='month'?'点击空白日期新建日程；点击事项编辑。待办的计划日与截止日分别展示；同一天标注计划 / 截止。':'点击空白时段新建日程，或拖入待办安排执行。重叠事项并列展示；时间轴以外的事项显示在顶部。'}</div></section><section class="card calendar-bottom"><div class="spread"><div><h3 style="font-size:12px">待安排的待办 <span class="muted">${unscheduled.length}</span></h3><p class="tiny muted" style="margin-top:4px">拖到日历里，或者打开详情设置计划时间。截止日期保持不变。</p function renderMonth(d){const first=day(new Date(d.getFullYear(),d.getMonth(),1)),start=monday(first);return `<div class="weeknames">${['一','二','三','四','五','六','日'].map(x=>`<span>周${x}</span>`).join('')}</div><div class="month-grid">${Array.from({length:42},(_,n)=>{const ds=addDays(start,n),items=calendarItems(ds);return `<div class="month-cell ${dateOf(ds).getMonth()!==d.getMonth()?'outside':''}" data-drop-date="${ds}"><button class="month-number ${ds===today()?'today':''}" data-action="cal-cell" data-date="${ds}" aria-label="${h(formatDate(ds,true))}，${items.length} 个事项，新建日程">${dateOf(ds).getDate()}</button>${items.slice(0,3).map(i=>calChip(i,ds)).join('')}${items.length>3?`<button class="more-chip" data-action="cal-day" data-date="${ds}">还有 ${items.length-3} 项</button>`:''}</div>`}).join('')}</div>`}
function renderYear(d){return `<div class="year-grid">${Array.from({length:12},(_,m)=>{const first=day(new Date(d.getFullYear(),m,1)),offset=(dateOf(first).getDay()+6)%7,num=new Date(d.getFullYear(),m+1,0).getDate();return `<button class="mini-month" data-action="cal-month" data-date="${first}"><h3>${m+1} 月 <span class="tiny muted">${state.items.filter(i=>[i.planDate,i.dueDate,i.remindAt?.slice(0,10)].some(d=>d?.startsWith(first.slice(0,7)))).length} 项</span></h3><div class="mini-days">${['一','二','三','四','五','六','日'].map(w=>`<span>${w}</span>`).join('')}${'<span></span>'.repeat(offset)}${Array.from({length:num},(_,n)=>{const s=`${first.slice(0,8)}${pad(n+1)}`;return `<span class="mini-num ${s===today()?'today':''} ${calendarItems(s).length?'has-items':''}">${n+1}</span>`}).join('')}</div></button>`}).join('')}</div>`}
function blockInterval(i,d){let s=i.type==='event'&&i.planDate<d?480:minutes(i.startTime);let e=i.type==='event'?(i.endDate&&i.endDate>d?1200:minutes(i.endTime||timeFrom(s+60))):s+(Number(i.duration)||30);return {i,s:Math.max(480,s),e:Math.min(1200,Math.max(e,s+15)),col:0,cols:1}}
function layoutIntervals(items,d){const xs=items.map(i=>blockInterval(i,d)).filter(v=>v.e>v.s).sort((a,b)=>a.s-b.s||b.e-a.e);let group=[],end=-1;const finish=()=>{const lanes=[];group.forEach(x=>{let lane=lanes.findIndex(e=>e<=x.s);if(lane<0)lane=lanes.length;x.col=lane;lanes[lane]=x.e;});group.forEach(x=>x.cols=lanes.length);};for(const x of xs){if(x.s>=end&&group.length){finish();group=[];end=-1}group.push(x);end=Math.max(end,x.e)}finish();return xs}
